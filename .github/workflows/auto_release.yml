name: Build & Release Android APK

on:
  push:
    tags:
      - '*'
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build:
    name: Build APK & Create GitHub Release
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Dawt.toolkit=sun.awt.HToolkit"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx4096m -Djava.awt.headless=true\" -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Android APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.6}"
          mkdir -p release_output
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "release_output/DailySpend-${TAG_NAME}.apk"
            echo "Successfully prepared: release_output/DailySpend-${TAG_NAME}.apk"
          else
            echo "Error: No APK found"
            exit 1
          fi
          ls -la release_output/

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_output/*.apk
          tag_name: ${{ github.ref_name || github.event.release.tag_name }}
          name: "DailySpend Release ${{ github.ref_name || github.event.release.tag_name }}"
          body: |
            ## 🚀 DailySpend ${{ github.ref_name || github.event.release.tag_name }}
            - Automated APK release package
            - Safe installation with persistent Room database storage
            
            _Download the APK below to install or update DailySpend!_
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
