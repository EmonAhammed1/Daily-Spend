name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag like v1.0.1, v1.0.2, v2.0.0
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab if desired

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK with Tag Version
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          mkdir -p release_output
          cp app/build/outputs/apk/debug/app-debug.apk release_output/DailySpend-${TAG_NAME}.apk
          echo "Built APK: DailySpend-${TAG_NAME}.apk"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: release_output/DailySpend-*.apk
          tag_name: ${{ github.ref_name }}
          name: "DailySpend Release ${{ github.ref_name }}"
          body: |
            ## 🚀 What's New in DailySpend ${{ github.ref_name }}
            - Automated build from GitHub Actions
            - Android app update package
            
            _Download the APK below or update directly within the DailySpend app!_
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
